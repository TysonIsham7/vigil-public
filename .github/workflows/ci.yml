name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          grep gitleaks_8.30.1_linux_x64.tar.gz .github/workflows/scanner-checksums.txt | (cd "$RUNNER_TEMP" && sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact
      - name: trufflehog
        run: |
          curl -fsSL -o "$RUNNER_TEMP/trufflehog_3.99.3_linux_amd64.tar.gz" https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.3/trufflehog_3.99.3_linux_amd64.tar.gz
          grep trufflehog_3.99.3_linux_amd64.tar.gz .github/workflows/scanner-checksums.txt | (cd "$RUNNER_TEMP" && sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/trufflehog_3.99.3_linux_amd64.tar.gz" -C "$RUNNER_TEMP" trufflehog
          "$RUNNER_TEMP/trufflehog" filesystem . --fail --no-update --exclude-paths .trufflehog-exclude

  ios-swift:
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Show the Xcode version
        run: xcodebuild -version && xcode-select -p && sw_vers
      - name: Compile the iOS extension
        run: |
          xcodebuild -project apps/safari/Vigil.xcodeproj \
            -target "Vigil iOS Extension" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build the iOS app without signing
        run: |
          xcodebuild -project apps/safari/Vigil.xcodeproj \
            -scheme "Vigil iOS" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/dd-compile" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Build the signed iOS scheme
        continue-on-error: true
        run: |
          xcodebuild -project apps/safari/Vigil.xcodeproj \
            -scheme "Vigil iOS" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/dd-signed" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= \
            build
      - name: Compare the appex with a converter template
        run: bash .github/scripts/diff-ios-embed.sh "${RUNNER_TEMP}/dd-compile" "${RUNNER_TEMP}/dd-signed" ios-embed-report.txt
      - name: Summarize embed probes
        if: always()
        run: |
          if [ -f ios-embed-report.txt ]; then
            {
              echo '## iOS embed probes'
              echo
              echo '```'
              grep -E '^(XCODE|TOOL|PROBE |CONCLUSION|LIST |VERIFY |PLIST-KEYS |SETTING |MUTATE |TEMPLATE |CONVERTER )' ios-embed-report.txt || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-embed-report
          path: ios-embed-report.txt
          if-no-files-found: warn
